---
- name: Inspect volume {{ _incus_retire_volume.name }}
  cloin.incus_compose.targeted_volume_info:
    name: "{{ _incus_retire_volume.name }}"
    pool: "{{ _incus_retire_volume.pool }}"
    project: "{{ incus_compose_retire_record.project }}"
    target: "{{ _incus_retire_volume.target or omit }}"
    url: "{{ incus_compose_connection.url }}"
    client_cert_path: "{{ incus_compose_connection.client_cert_path }}"
    client_key_path: "{{ incus_compose_connection.client_key_path }}"
    server_cert_path: "{{ incus_compose_connection.server_cert_path | default(omit, true) }}"
    validate_certs: "{{ incus_compose_connection.validate_certs | default(true) }}"
  register: _incus_retire_volume_info
  no_log: "{{ incus_compose_hide_sensitive_values }}"

- name: Verify volume {{ _incus_retire_volume.name }} ownership
  ansible.builtin.assert:
    that:
      - >-
        _incus_retire_volume_info.storage_volumes[0].config.get(
          'user.cloin.incus_compose.owner', '') ==
        incus_compose_retire_record.token
    fail_msg: "Volume ownership changed; refusing data removal."
  when:
    - incus_compose_retire_verify | bool
    - _incus_retire_volume_info.storage_volumes | length > 0
  no_log: "{{ incus_compose_hide_sensitive_values }}"

- name: Delete volume {{ _incus_retire_volume.name }}
  damex.incus.incus_storage_volume:
    name: "{{ _incus_retire_volume.name }}"
    pool: "{{ _incus_retire_volume.pool }}"
    project: "{{ incus_compose_retire_record.project }}"
    target: "{{ _incus_retire_volume.target or omit }}"
    state: absent
    url: "{{ incus_compose_connection.url }}"
    client_cert_path: "{{ incus_compose_connection.client_cert_path }}"
    client_key_path: "{{ incus_compose_connection.client_key_path }}"
    server_cert_path: "{{ incus_compose_connection.server_cert_path | default(omit, true) }}"
    validate_certs: "{{ incus_compose_connection.validate_certs | default(true) }}"
  when: _incus_retire_volume_info.storage_volumes | length > 0
