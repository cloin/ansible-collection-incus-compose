---
- name: Inspect service {{ _incus_retire_service.name }} before teardown
  damex.incus.incus_instance_info:
    name: "{{ _incus_retire_service.name }}"
    project: "{{ incus_compose_retire_record.project }}"
    url: "{{ incus_compose_connection.url }}"
    client_cert_path: "{{ incus_compose_connection.client_cert_path }}"
    client_key_path: "{{ incus_compose_connection.client_key_path }}"
    server_cert_path: "{{ incus_compose_connection.server_cert_path | default(omit, true) }}"
    validate_certs: "{{ incus_compose_connection.validate_certs | default(true) }}"
  register: _incus_retire_preflight_resource
  no_log: true

- name: Reject conflicting service ownership before teardown
  ansible.builtin.assert:
    that:
      - >-
        _incus_retire_preflight_resource.instances[0].config.get(
          'user.cloin.incus_compose.owner', '') ==
        incus_compose_retire_record.token
    fail_msg: "Service ownership changed; refusing retirement."
  when: _incus_retire_preflight_resource.instances | length > 0
  no_log: true
