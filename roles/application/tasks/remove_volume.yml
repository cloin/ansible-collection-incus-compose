---
- name: Calculate volume {{ _incus_volume_item.key }} removal placement
  ansible.builtin.set_fact:
    _incus_remove_volume_pool: >-
      {{ _incus_volume_item.value.pool |
         default(_incus_app_defaults.storage_pool |
         default(incus_default_storage_pool)) }}

- name: Remove volume {{ _incus_volume_item.key }}
  damex.incus.incus_storage_volume:
    name: "{{ _incus_volume_item.value.name | default(_incus_volume_item.key) }}"
    pool: "{{ _incus_remove_volume_pool }}"
    project: "{{ _incus_app_project }}"
    target: >-
      {{ (_incus_volume_item.value.target |
          default(_incus_app.placement_member))
         if (_incus_compose_clustered and
             _incus_compose_storage_drivers[_incus_remove_volume_pool] in
             incus_compose_local_storage_drivers)
         else omit }}
    state: absent
    url: "{{ incus_api_url }}"
    client_cert_path: "{{ incus_client_cert_path }}"
    client_key_path: "{{ incus_client_key_path }}"
    server_cert_path: "{{ incus_server_cert_path | default(omit, true) }}"
    validate_certs: "{{ incus_validate_certs }}"
