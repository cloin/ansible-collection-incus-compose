---
- name: Read ownership marker for service {{ _incus_owner_instance.name }}
  ansible.builtin.command:
    argv:
      - incus
      - config
      - get
      - "{{ incus_remote }}:{{ _incus_owner_instance.name }}"
      - user.cloin.incus_compose.owner
      - --project
      - "{{ _incus_compose_ownership_snapshot.project }}"
  register: _incus_owner_marker
  changed_when: false

- name: Mark service {{ _incus_owner_instance.name }} as collection-owned
  ansible.builtin.command:
    argv:
      - incus
      - config
      - set
      - "{{ incus_remote }}:{{ _incus_owner_instance.name }}"
      - "user.cloin.incus_compose.owner={{ _incus_compose_ownership.record.token }}"
      - --project
      - "{{ _incus_compose_ownership_snapshot.project }}"
  changed_when: true
  when: _incus_owner_marker.stdout != _incus_compose_ownership.record.token
